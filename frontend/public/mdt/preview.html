<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Police MDT — Preview</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            /* Nur für die Browser-Preview: dezenter dunkler Hintergrund (im Spiel ist er transparent) */
            body {
                background:
                    radial-gradient(1200px 700px at 20% -10%, rgba(47,212,238,0.06), transparent 60%),
                    radial-gradient(1000px 700px at 90% 110%, rgba(56,189,248,0.05), transparent 60%),
                    #04060a;
            }
        </style>
    </head>
    <body>
        <div id="app" class="app app--hidden">
            <div class="topbar">
                <div class="brand">
                    <div class="brand__eyebrow">Mobile Data Terminal</div>
                    <div class="brand__title"><span class="caret">&gt;</span> LSPD // MDT</div>
                    <div class="brand__underline"></div>
                    <div id="officerName" class="brand__sub"></div>
                </div>
                <div class="topbar__right">
                    <div class="topbar__badges" id="topBadges">
                        <div class="badge"><div class="badge__k">Officer</div><div class="badge__v badge__v--plain" id="badgeOfficer">—</div></div>
                        <div class="badge"><div class="badge__k">Rang</div><div class="badge__v" id="badgeRank">—</div></div>
                        <div class="badge"><div class="badge__k">Streife</div><div class="badge__v" id="badgeUnit">—</div></div>
                    </div>
                    <button id="closeBtn" class="iconbtn" title="Schließen (ESC)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>

            <div class="layout">
                <nav class="sidebar">
                    <button class="navbtn navbtn--active" data-tab="overview">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                        Übersicht
                    </button>
                    <button class="navbtn" data-tab="persons">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        Personen
                    </button>
                    <button class="navbtn" data-tab="vehicles">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2l.64-2.54a6 6 0 0 0-.44-3.9l-.82-1.64A2 2 0 0 0 18.6 8H5.4a2 2 0 0 0-1.78 1.1l-.82 1.63a6 6 0 0 0-.44 3.9L3 17h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                        Fahrzeuge
                    </button>
                    <button class="navbtn" data-tab="reports">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5M8 13h8M8 17h5"/></svg>
                        Berichte
                    </button>
                    <button class="navbtn" data-tab="cases">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                        Fälle
                    </button>
                    <button class="navbtn" data-tab="warrants">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg>
                        Fahndung
                    </button>
                    <button class="navbtn" data-tab="tickets">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
                        Tickets
                    </button>
                    <button class="navbtn" data-tab="charges">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                        Katalog
                    </button>
                    <button class="navbtn" data-tab="officers">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1Z"/></svg>
                        Officers
                    </button>
                    <button class="navbtn" data-tab="groups">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg>
                        Gruppenakten
                    </button>
                    <button class="navbtn" data-tab="dispatch">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                        Dispatch
                    </button>
                </nav>

                <main class="content">
                    <section id="tab-overview" class="tab tab--active">
                        <div id="dashboardRoot"></div>
                    </section>

                    <section id="tab-persons" class="tab">
                        <div class="panel">
                            <div class="panel__header">
                                <div class="panel__title">Personen-Suche</div>
                                <div class="panel__tools">
                                    <input id="personQuery" class="input" placeholder="Name, SSN..." />
                                    <button id="personSearchBtn" class="btn btn--primary">Suchen</button>
                                </div>
                            </div>
                            <div class="grid">
                                <div class="list" id="personResults"></div>
                                <div class="details" id="personDetails"><div class="muted">Wähle eine Person aus.</div></div>
                            </div>
                        </div>
                    </section>

                    <section id="tab-vehicles" class="tab">
                        <div class="panel">
                            <div class="panel__header">
                                <div class="panel__title">Fahrzeug-Suche</div>
                                <div class="panel__tools">
                                    <input id="vehicleQuery" class="input" placeholder="Kennzeichen..." />
                                    <button id="vehicleSearchBtn" class="btn btn--primary">Suchen</button>
                                </div>
                            </div>
                            <div class="grid">
                                <div class="list" id="vehicleResults"></div>
                                <div class="details" id="vehicleDetails"><div class="muted">Wähle ein Fahrzeug aus.</div></div>
                            </div>
                        </div>
                    </section>

                    <section id="tab-reports" class="tab">
                        <div class="panel">
                            <div class="panel__header">
                                <div class="panel__title">Berichte</div>
                                <div class="panel__tools">
                                    <button id="reportRefreshBtn" class="btn">Aktualisieren</button>
                                    <button id="reportNewBtn" class="btn btn--primary">Neuer Bericht</button>
                                </div>
                            </div>
                            <div class="grid grid--single"><div class="list" id="reportResults"></div></div>
                        </div>
                    </section>

                    <section id="tab-cases" class="tab">
                        <div class="panel">
                            <div class="panel__header">
                                <div class="panel__title">Fälle</div>
                                <div class="panel__tools">
                                    <button id="caseRefreshBtn" class="btn">Aktualisieren</button>
                                    <button id="caseNewBtn" class="btn btn--primary">Neuer Fall</button>
                                </div>
                            </div>
                            <div class="grid grid--single"><div class="list" id="caseResults"></div></div>
                        </div>
                    </section>

                    <section id="tab-warrants" class="tab">
                        <div class="panel">
                            <div class="panel__header">
                                <div class="panel__title">Fahndungen</div>
                                <div class="panel__tools">
                                    <button id="warrantRefreshBtn" class="btn">Aktualisieren</button>
                                    <button id="warrantNewBtn" class="btn btn--primary">Neu</button>
                                </div>
                            </div>
                            <div class="grid grid--single"><div class="list" id="warrantResults"></div></div>
                        </div>
                    </section>

                    <section id="tab-tickets" class="tab">
                        <div class="panel">
                            <div class="panel__header">
                                <div class="panel__title">Tickets</div>
                                <div class="panel__tools">
                                    <button id="ticketRefreshBtn" class="btn">Aktualisieren</button>
                                    <button id="ticketNewBtn" class="btn btn--primary">Neu</button>
                                </div>
                            </div>
                            <div class="grid grid--single"><div class="list" id="ticketResults"></div></div>
                        </div>
                    </section>

                    <section id="tab-charges" class="tab">
                        <div class="panel">
                            <div class="panel__header">
                                <div class="panel__title">Strafen-Katalog</div>
                                <div class="panel__tools"><button id="chargeRefreshBtn" class="btn">Aktualisieren</button></div>
                            </div>
                            <div class="grid grid--single"><div class="list" id="chargeResults"></div></div>
                        </div>
                    </section>

                    <section id="tab-officers" class="tab">
                        <div class="panel">
                            <div class="panel__header">
                                <div class="panel__title">Officers</div>
                                <div class="panel__tools"><button id="officerRefreshBtn" class="btn">Aktualisieren</button></div>
                            </div>
                            <div class="grid grid--single"><div class="list" id="officerResults"></div></div>
                        </div>
                    </section>

                    <section id="tab-groups" class="tab">
                        <div class="panel">
                            <div class="panel__header">
                                <div class="panel__title">Gruppenakten</div>
                                <div class="panel__tools">
                                    <button id="groupRefreshBtn" class="btn">Aktualisieren</button>
                                    <button id="groupNewBtn" class="btn btn--primary">Neu</button>
                                </div>
                            </div>
                            <div class="grid grid--single"><div class="list" id="groupResults"></div></div>
                        </div>
                    </section>

                    <section id="tab-dispatch" class="tab">
                        <div class="panel">
                            <div class="panel__header">
                                <div class="panel__title">Dispatch</div>
                                <div class="panel__tools">
                                    <button id="dispatchRefreshBtn" class="btn">Aktualisieren</button>
                                    <button id="dispatchCalBtn" class="btn">Kalibrieren</button>
                                </div>
                            </div>
                            <div class="grid grid--single">
                                <div id="unitPanel" class="details" style="border-bottom: 1px solid rgba(255,255,255,0.06);"></div>
                                <div id="dispatchMapWrap" class="dispatch-map-wrap">
                                    <div id="dispatchMap" class="dispatch-map dispatch-map--rotated"></div>
                                </div>
                                <div id="dispatchInfo" class="details" style="border-bottom: 1px solid rgba(255,255,255,0.06);"></div>
                                <div class="list" id="dispatchResults"></div>
                            </div>
                        </div>
                    </section>
                </main>
            </div>

            <div id="modal" class="modal modal--hidden">
                <div class="modal__card">
                    <div class="modal__header">
                        <div id="modalTitle" class="modal__title"></div>
                        <button id="modalClose" class="iconbtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div id="modalBody" class="modal__body"></div>
                </div>
            </div>
        </div>

        <script src="mock.js"></script>
        <script src="app.js"></script>
        <script>
            // Deterministisch: app.js ist hier bereits ausgeführt -> Listener aktiv.
            window.dispatchEvent(new MessageEvent('message', {
                data: { action: 'open', payload: window.__MDT_OPEN_PAYLOAD__ }
            }));
            // Optional: ?tab=dispatch etc. für gezielte Vorschau einzelner Bereiche
            (function () {
                var p = new URLSearchParams(location.search);
                var t = p.get('tab');
                if (t && typeof window.setTab === 'function') {
                    try { window.setTab(t); } catch (e) {}
                }
                // Demo: auf dem Dispatch-Tab neue Notrufe live einspielen
                if (t === 'dispatch' && typeof window.__MDT_START_SIM__ === 'function') {
                    window.__MDT_START_SIM__();
                }
                var person = p.get('person');
                if (person && typeof window.loadPerson === 'function') {
                    setTimeout(function () { try { window.loadPerson(person); } catch (e) {} }, 200);
                }
                var vehicle = p.get('vehicle');
                if (vehicle && typeof window.loadVehicle === 'function') {
                    setTimeout(function () { try { window.loadVehicle(vehicle); } catch (e) {} }, 200);
                }
            })();
        </script>
    </body>
</html>
